name: bigproject-core-test
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: bigproject_core_test
      POSTGRES_USER: core_test
      POSTGRES_PASSWORD: ${CORE_TEST_PASSWORD:?Set a temporary test password}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_test -d bigproject_core_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--requirepass", "${CORE_TEST_PASSWORD:?Set a temporary test password}"]
    ports:
      - "127.0.0.1:56379:6379"
  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: core-test
      AWS_SECRET_ACCESS_KEY: ${CORE_TEST_PASSWORD:?Set a temporary test password}
      S3_BUCKET: bigproject-core-test
    ports:
      - "127.0.0.1::8333"
